name: Products CI/CD

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'exercise8/products-api/**'
      - 'exercise8/products-ui/**'
      - 'exercise8/db/**'
      - '.github/workflows/ci-cd.yml'
  push:
    branches: [main]
    paths:
      - 'exercise8/products-api/**'
      - 'exercise8/products-ui/**'
      - 'exercise8/db/**'
      - '.github/workflows/ci-cd.yml'

jobs:
  # Runs on every PR and every push to main. A PR from a fork never has
  # access to secrets on this repo, so this job can only ever read code and
  # run tests — nothing here can leak DOCKERHUB_TOKEN. products-db has no
  # application code (just a seed .sql baked into the postgres image), so
  # there's nothing to unit test there — it only goes through build-and-push.
  test:
    name: Unit tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [products-api, products-ui]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
          cache-dependency-path: exercise8/${{ matrix.service }}/pom.xml

      - name: Run unit tests
        working-directory: exercise8/${{ matrix.service }}
        run: mvn -B test

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.service }}
          path: exercise8/${{ matrix.service }}/target/surefire-reports
          retention-days: 7

  # Only runs after tests pass, and only for a push that landed on main
  # (never for a PR, which may not even be merged yet) — the gate is both
  # "tests green" and "this is the real main branch".
  build-and-push:
    name: Build & push (${{ matrix.image }})
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: products-api
            context: exercise8/products-api
          - image: products-ui
            context: exercise8/products-ui
          - image: products-db
            context: exercise8/db
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      # Multi-arch (amd64 + arm64) on purpose: this runner is amd64, but these
      # images also need to run on an arm64 Minikube (e.g. Apple Silicon) via
      # exercise8/deploy-local.sh. A single-arch push here silently overwrites
      # whatever platform someone last pushed manually to the same :latest tag,
      # breaking `kubectl rollout restart` on the other architecture with
      # "no matching manifest for linux/arm64/v8" — that's a real failure this
      # pipeline hit once already. setup-qemu-action lets buildx cross-build the
      # arm64 image on this amd64 runner instead of needing a native arm64 runner.
      #
      # products-api and products-ui both pull FROM icr.io/appcafe/websphere-liberty
      # (IBM's registry, which does publish arm64) as their runtime base image.
      # That pull has timed out from GitHub-hosted runners before (dial tcp ...:
      # i/o timeout resolving the manifest) — a transient network issue between
      # GitHub and icr.io, not a problem with the Dockerfile, so the fix is to
      # retry the whole build+push, not to change what it does.
      - name: Build and push (multi-arch, retries on transient registry timeouts)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 20
          command: >
            docker buildx build --push
            --platform linux/amd64,linux/arm64
            -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest
            -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ github.sha }}
            ${{ matrix.context }}
