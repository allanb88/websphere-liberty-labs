name: Products CI/CD

on:
  pull_request:
    branches: [main]
    paths:
      - 'exercise7/products-api/**'
      - 'exercise7/products-ui/**'
      - '.github/workflows/ci-cd.yml'
  push:
    branches: [main]
    paths:
      - 'exercise7/products-api/**'
      - 'exercise7/products-ui/**'
      - '.github/workflows/ci-cd.yml'

jobs:
  # Runs on every PR and every push to main. A PR from a fork never has
  # access to secrets on this repo, so this job can only ever read code and
  # run tests — nothing here can leak DOCKERHUB_TOKEN.
  test:
    name: Unit tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [products-api, products-ui]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
          cache-dependency-path: exercise7/${{ matrix.service }}/pom.xml

      - name: Run unit tests
        working-directory: exercise7/${{ matrix.service }}
        run: mvn -B test

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.service }}
          path: exercise7/${{ matrix.service }}/target/surefire-reports
          retention-days: 7

  # Only runs after tests pass, and only for a push that landed on main
  # (never for a PR, which may not even be merged yet) — the gate is both
  # "tests green" and "this is the real main branch".
  build-and-push:
    name: Build & push (${{ matrix.service }})
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [products-api, products-ui]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: exercise7/${{ matrix.service }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:${{ github.sha }}
